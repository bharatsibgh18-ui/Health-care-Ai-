name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version

          RAW_VERSION="$(java -version 2>&1 | awk -F '"' '/version/ {print $2; exit}')"
          if [[ -z "${RAW_VERSION}" ]]; then
            echo "::error::Failed to detect the active Java version."
            exit 1
          fi

          if [[ "${RAW_VERSION}" == 1.* ]]; then
            JAVA_MAJOR="$(echo "${RAW_VERSION}" | cut -d'.' -f2)"
          else
            JAVA_MAJOR="$(echo "${RAW_VERSION}" | cut -d'.' -f1)"
          fi

          if ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse active Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          echo "Detected active Java major version: ${JAVA_MAJOR}"
          if (( JAVA_MAJOR < 17 )); then
            echo "::error::Java 17 or newer is required, but detected Java ${JAVA_MAJOR} (${RAW_VERSION})."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "./debug.keystore" ]]; then
            echo "Debug keystore already exists at ./debug.keystore; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [[ ! -x "${KEYTOOL_BIN}" ]]; then
              echo "::error::keytool not found in configured Java 17 installation (${JAVA_HOME})."
              exit 1
            fi

            "${KEYTOOL_BIN}" -genkeypair \
              -keystore "./debug.keystore" \
              -storepass "android" \
              -alias "androiddebugkey" \
              -keypass "android" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg "RSA" \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

          if [[ ! -f "./debug.keystore" || ! -s "./debug.keystore" ]]; then
            echo "::error::Failed to create temporary debug keystore at ./debug.keystore."
            exit 1
          fi

          echo "Temporary debug keystore is ready for the debug build."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -e "${EXPECTED_APK}" ]]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            if [[ -d "app/build/outputs/apk" ]]; then
              echo "APK paths discovered inside app/build/outputs/apk:"
              find "app/build/outputs/apk" -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [[ ! -f "${EXPECTED_APK}" ]]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi

          if [[ ! -s "${EXPECTED_APK}" ]]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          if [[ "${EXPECTED_APK}" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi

          APK_BYTES="$(wc -c < "${EXPECTED_APK}" | tr -d ' ')"
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_BYTES} bytes)"

      - name: Upload debug APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "${SOURCE_APK}" || ! -s "${SOURCE_APK}" || "${SOURCE_APK}" != *.apk ]]; then
            echo "::error::Verified debug APK is missing or invalid at ${SOURCE_APK}."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SANITIZED_REPO="$(printf '%s' "${RAW_REPO_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-{2,}/-/g')"
          if [[ -z "${SANITIZED_REPO}" ]]; then
            SANITIZED_REPO="android-app"
          fi

          RELEASE_ASSET_NAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_TMP_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")"
          RELEASE_ASSET_PATH="${RELEASE_TMP_DIR}/${RELEASE_ASSET_NAME}"

          cp "${SOURCE_APK}" "${RELEASE_ASSET_PATH}"

          if [[ ! -f "${RELEASE_ASSET_PATH}" || ! -s "${RELEASE_ASSET_PATH}" || "${RELEASE_ASSET_PATH}" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed at ${RELEASE_ASSET_PATH}."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          {
            echo "asset_path=${RELEASE_ASSET_PATH}"
            echo "asset_name=${RELEASE_ASSET_NAME}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "${GITHUB_OUTPUT}"

          echo "Prepared APK release asset: ${RELEASE_ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.prepare_release_asset.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_release_asset.outputs.release_title }}
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi
          gh --version

          if [[ -z "${ASSET_PATH}" || ! -f "${ASSET_PATH}" || ! -s "${ASSET_PATH}" || "${ASSET_PATH}" != *.apk ]]; then
            echo "::warning::Prepared APK release asset is missing, empty, or not a .apk file."
            exit 1
          fi

          RELEASE_NOTES="$(cat <<EOF
          Automatically generated debug APK built by GitHub Actions.

          - **Build Type:** Debug APK (automatically generated)
          - **Built By:** GitHub Actions
          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **APK Asset:** \`${ASSET_NAME}\`

          ### Important Notices
          - This APK is intended for testing purposes.
          - This APK is **not** a Play Store production release.
          - This APK is signed only with a temporary debug keystore generated during the workflow run.
          EOF
          )"

          gh release create "${RELEASE_TAG}" \
            "${ASSET_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --latest

      - name: Report APK download result
        if: ${{ steps.publish_release.outcome == 'success' || steps.publish_release.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.prepare_release_asset.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_release_asset.outputs.release_title }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${PUBLISH_OUTCOME}" == "success" ]]; then
            RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url' || true)"
            if [[ -n "${RELEASE_URL}" ]]; then
              echo "GitHub Release published successfully."
              echo "Release tag: ${RELEASE_TAG}"
              echo "Release title: ${RELEASE_TITLE}"
              echo "Release URL: ${RELEASE_URL}"
              echo "APK asset filename: ${ASSET_NAME}"

              {
                echo "## Debug APK Download"
                echo ""
                echo "- **Status:** Build succeeded and GitHub Release published"
                echo "- **Release Tag:** \`${RELEASE_TAG}\`"
                echo "- **Release Title:** ${RELEASE_TITLE}"
                echo "- **APK Asset:** \`${ASSET_NAME}\`"
                echo "- **GitHub Release Page:** ${RELEASE_URL}"
                echo ""
                echo "Download the APK directly from the **Assets** section of the release page above."
                echo ""
                echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup on this workflow run."
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi

          echo "::warning::GitHub Release publishing did not complete, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
          {
            echo "## Debug APK Download"
            echo ""
            echo "> **Warning:** Publishing to GitHub Releases failed, so no release URL is available."
            echo ""
            echo "- **APK Build Status:** Succeeded"
            echo "- **Backup Download:** Download the \`app-debug-apk\` artifact directly from the **Artifacts** section of this GitHub Actions workflow run."
          } >> "${GITHUB_STEP_SUMMARY}"
